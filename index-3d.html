<!DOCTYPE html>
<html>
<head>
  <title>3D Cymatics</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
</head>

<body style="margin:0; overflow:hidden; background:black;">
<script>
let bgImg;

let osc;
let playing = false;

let freq = 420;
let amp = 0.6;
let symmetry = 5;
let detail = 60;

let freqSlider, ampSlider, symmetrySlider, detailSlider;
let freqLabel;

function preload() {
  bgImg = loadImage('bg.svg');
}

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);

  osc = new p5.Oscillator('sine');

  createButton('Play / Stop')
    .position(20, 20)
    .mousePressed(toggleSound);

  freqLabel = createP('Frequency: ' + freq + ' Hz')
    .position(20, 45)
    .style('color', 'white');

  freqSlider = createSlider(80, 700, freq, 1)
    .position(20, 85)
    .style('width', '240px');

  createP('Amplitude').position(20, 100).style('color', 'white');
  ampSlider = createSlider(0, 1, amp, 0.01)
    .position(20, 140)
    .style('width', '240px');

  createP('Symmetry').position(20, 155).style('color', 'white');
  symmetrySlider = createSlider(2, 12, symmetry, 1)
    .position(20, 195)
    .style('width', '240px');

  createP('Detail').position(20, 210).style('color', 'white');
  detailSlider = createSlider(20, 90, detail, 1)
    .position(20, 250)
    .style('width', '240px');
}

function draw() {
  background(0);

// Full-screen SVG background
push();
resetMatrix();
translate(0, 0, -900);

// keep image covering the full viewport
let bgAspect = bgImg.width / bgImg.height;
let screenAspect = width / height;

let bgW, bgH;

if (screenAspect > bgAspect) {
  bgW = width;
  bgH = width / bgAspect;
} else {
  bgH = height;
  bgW = height * bgAspect;
}

// subtle world-colour treatment
tint(120, 170, 255, 230);

noStroke();
texture(bgImg);
plane(bgW, bgH);

noTint();
pop();

  freq = freqSlider.value();
  amp = ampSlider.value();
  symmetry = symmetrySlider.value();
  detail = detailSlider.value();

  freqLabel.html('Frequency: ' + freq + ' Hz');

  if (playing) {
    osc.freq(freq);
    osc.amp(0.08, 0.1);
  }

  orbitControl();

  rotateY(frameCount * 0.006);
  rotateX(frameCount * 0.003);

  let baseRadius = min(width, height) * 0.24;
  let time = frameCount * 0.045;

  blendMode(ADD);
  noFill();

  for (let lat = 0; lat <= detail; lat++) {
    let theta = map(lat, 0, detail, 0, PI);

    for (let lon = 0; lon <= detail; lon++) {
      let phi = map(lon, 0, detail, 0, TWO_PI);

      let p = shapePoint(theta, phi, baseRadius, time);

      let glow = map(p.energy, -1, 1, 0.2, 1);
      glow = constrain(glow, 0, 1);

      stroke(255, 255, 255, 25 * glow);
      strokeWeight(14 * glow);
      point(p.x, p.y, p.z);

      stroke(255, 255, 255, 70 * glow);
      strokeWeight(6 * glow);
      point(p.x, p.y, p.z);

      stroke(255, 255, 255, 180 * glow);
      strokeWeight(1.5);
      point(p.x, p.y, p.z);
    }
  }

  blendMode(BLEND);
}

function shapePoint(theta, phi, baseRadius, time) {
  let wave1 = sin(theta * symmetry + time);
  let wave2 = cos(phi * symmetry * 0.8 - time * 1.1);
  let wave3 = sin((theta + phi) * freq * 0.008);

  let energy = (wave1 + wave2 + wave3) / 3;
  let displacement = energy * amp * 30;

  let r = baseRadius + displacement;

  let x = r * sin(theta) * cos(phi);
  let y = r * cos(theta);
  let z = r * sin(theta) * sin(phi);

  return { x, y, z, energy };
}

function toggleSound() {
  userStartAudio();

  if (!playing) {
    osc.start();
    osc.amp(0.08, 0.1);
    playing = true;
  } else {
    osc.amp(0, 0.1);
    playing = false;
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
